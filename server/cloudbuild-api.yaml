steps:
  # Pull the cached image from Artifact Registry (with fallback for first build)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    dir: 'server'
    args: ['-c', 'docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest || exit 0']
    id: Pulling cached image

  # Build the container image with cache optimization
  - name: gcr.io/cloud-builders/docker
    dir: 'server'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}',
      '--cache-from', '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest',
      '-f', 'Dockerfile',
      '.'
    ]
    id: Building the container image

  # Tag the image as latest for future caching
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}', '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest']
    id: Tagging as latest

  # Push both the tagged image and latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}']
    id: Pushing the image to registry

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest']
    id: Pushing latest tag

  # Deploy container image to Cloud Run (env vars / VPC connector already set on the service persist across deploys)
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', '${_SERVICE_NAME}', '--image', '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}', '--region', '${_REGION}', '--platform', 'managed', '--allow-unauthenticated']

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: homeserv-api

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest'
