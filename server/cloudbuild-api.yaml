options:
 logging: CLOUD_LOGGING_ONLY

steps:
  # Pull the cached image from Artifact Registry (with fallback for first build)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    dir: 'server'
    args: ['-c', 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest || exit 0']
    id: Pulling cached image

  # Build the container image with cache optimization
  - name: gcr.io/cloud-builders/docker
    dir: 'server'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}',
      '--cache-from', 'us-central1-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest',
      '-f', 'server/Dockerfile',
      '.'
    ]
    id: Building the container image

  # Tag the image as latest for future caching
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'us-central1-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}', '${_REGION}-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest']
    id: Tagging as latest

  # Push both the tagged image and latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}']
    id: Pushing the image to registry

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/homeserv/api:latest']
    id: Pushing latest tag

  # Deploy container image to Cloud Run (env vars / VPC connector already set on the service persist across deploys)
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', '${_SERVICE_NAME}', '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/homeserv/api/$BRANCH_NAME:${COMMIT_SHA}', '--region', '${_REGION}', '--platform', 'managed', '--allow-unauthenticated']

