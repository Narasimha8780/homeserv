options:
 logging: CLOUD_LOGGING_ONLY

steps:
  # Pull the cached image from Artifact Registry (with fallback for first build)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/homeserv/web:latest || exit 0']
    id: Pulling cached image

  # Build the container image with cache optimization
  - name: gcr.io/cloud-builders/docker
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/homeserv/web/$BRANCH_NAME:${COMMIT_SHA}',
      '--cache-from', 'us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/homeserv/web:latest',
      '--build-arg', 'VITE_API_URL=${_VITE_API_URL}',
      '--build-arg', 'VITE_PHONE_EMAIL_CLIENT_ID=${_VITE_PHONE_EMAIL_CLIENT_ID}',
      '-f', 'Dockerfile',
      '.'
    ]
    id: Building the container image

  # Tag the image as latest for future caching
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/homeserv/web/$BRANCH_NAME:${COMMIT_SHA}', 'us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/homeserv/web:latest']
    id: Tagging as latest

  # Push both the tagged image and latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/homeserv/web/$BRANCH_NAME:${COMMIT_SHA}']
    id: Pushing the image to registry

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/homeserv/web:latest']
    id: Pushing latest tag

  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', '${_SERVICE_NAME}', '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/homeserv/web/$BRANCH_NAME:${COMMIT_SHA}', '--region', 'us-central1', '--platform', 'managed', '--allow-unauthenticated']

substitutions:
  # phone.email "Sign in with Phone" client id. Public (it ships in the page).
  # Override in the trigger if it ever changes; leaving it unset would silently
  # drop the verify button and fall sign-up back to PIN only.
  _VITE_PHONE_EMAIL_CLIENT_ID: '14389642174489995252'
