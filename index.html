<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/homeserv-favicon-v2.png" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <!-- viewport-fit=cover lets the Android app draw edge-to-edge; safe-area insets are handled in CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="color-scheme" content="dark light" />
    <title>HomeServ - Local Services Directory | Plumbers, Electricians, Drivers & More</title>
    <meta name="description" content="Find verified local plumbers, electricians, drivers, carpenters and more in your city. Call or WhatsApp them directly — a free local services directory for Tier 1, 2 & Semi-Urban India." />

    <!-- Apply the saved theme before first paint so there's no light/dark flash -->
    <script>
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('homeserv_prefs_v1') || '{}');
          var theme = prefs.theme || 'dark';
          if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
